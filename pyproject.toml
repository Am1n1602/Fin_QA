[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "Fin_QA"
version = "0.1.0"
description = "AI-powered financial intelligence platform for NIFTY 50 equities -- natural-language QA over NSE/BSE filings, backed by a deterministic calculation engine and a RAG-grounded LLM narrative layer."
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
    "jugaad-data>=0.35",
    "bse>=3.3",
    "requests>=2.31",
    "pandas>=2.0",
    "lxml",
    "pyyaml>=6.0",
    "torch",
    "sentence-transformers",
    "faiss-cpu",
    "pypdf",
    "pymupdf",
    "rank-bm25",
    "numpy",
    "psycopg[binary]>=3.1",
    "pgvector>=0.2.5",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.39"]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
ocr = ["pytesseract", "pillow"]
storage = ["boto3>=1.34"]

[project.scripts]
# fin_llm_platform/ and api/ (v1) moved into archive/ -- still installable/runnable,
# just no longer the primary system. finqa_v2 is unaffected either way.
finqa = "archive.fin_llm_platform.cli:main"
finqa-pipeline = "archive.fin_llm_platform.pipeline:main"
finqa-setup = "archive.fin_llm_platform.setup_scheduler:main"
finqa-api = "archive.api.main:run"
finqa-api-v2 = "finqa_v2.api.main:run"

[tool.setuptools.packages.find]
include = ["archive", "archive.fin_llm_platform*", "archive.api*", "finqa_v2*"]