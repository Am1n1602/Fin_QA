# Per-intent RRF leg weights (§16). Missing/unconfigured intents default to (1.0, 1.0) --
# i.e. plain unweighted RRF, byte-for-byte the pre-§16 behavior. `default:` applies when no
# intent is given or the intent isn't listed below. See fusion_weights.py:get_fusion_weights()
# and HybridRetriever.retrieve(..., weighted_fusion=True).
#
# "Do not select weights without benchmark evidence" (§16) -- see evaluation/results/
# fusion_v21_*.json. A global lexical:vector reweight sweep (9 ratios incl. 0.3:1.7 through
# 2:1) found plain equal-weight RRF (1.0, 1.0) beats EVERY alternative in aggregate --
# REJECTED as a global change. But per-category Recall@5 (same dataset, lexical-only vs
# vector-only vs hybrid) showed hybrid actually UNDERPERFORMING the stronger single leg for
# 3 categories -- RRF's rank-only fusion diluting a leg that was already winning outright:
#   management_commentary: lexical 0.52 vs vector 0.16 vs hybrid 0.40 (worse than lexical!)
#   trend:                 lexical 0.567 vs vector 0.30 vs hybrid 0.50 (worse than lexical!)
#   multi_hop:              lexical 0.567 vs vector 0.633 vs hybrid 0.567 (worse than vector!)
# table showed the same pattern (lexical 0.35 vs vector 0.75 vs hybrid 0.65) but a
# recall@5-moving reweight wasn't found -- its override below is kept anyway because it still
# improves MRR (pulls the correct table chunk to a higher rank within the existing top-5)
# with zero measured regression. Weights below are the ones this phase's A/B confirmed:
# aggregate Recall@5 0.4273->0.4394 (+2.8% relative), MRR 0.2916->0.3050 (+4.6% relative),
# nDCG@5 0.2591->0.2669, latency unaffected -- zero regression in any of the other 8
# categories (causal/comparison/cross_document/narrative/numeric/ratio/segment unchanged).
default:
  lexical: 1.0
  vector: 1.0
management_commentary:
  lexical: 2.0
  vector: 0.5
trend:
  lexical: 2.5
  vector: 0.3
multi_hop:
  lexical: 0.7
  vector: 1.3
table:
  lexical: 0.2
  vector: 3.0
