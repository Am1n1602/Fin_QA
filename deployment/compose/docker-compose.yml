# Fin_QA v2 -- full local stack: every piece as its own container.
#   cd deployment/compose
#   docker compose up -d --build postgres minio minio-init api dashboard prometheus grafana
#   # one-time, once postgres is up: from the repo root (needs the local venv)
#   #   FINQA_PG_URL=postgresql://finqa:finqa@localhost:55432/finqa python -m finqa_v2.postgres.migrate
#
# Bind mounts point at the repo's real database/data/ and data_extraction/data/ on
# the host (not Docker-managed volumes) -- those directories already hold the actual
# dataset; nothing here recreates it. Paths below are relative to this file.
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: finqa-pg
    environment:
      POSTGRES_USER: finqa
      POSTGRES_PASSWORD: finqa
      POSTGRES_DB: finqa
    ports:
      - "55432:5432"
    volumes:
      - finqa_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finqa -d finqa"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: finqa-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: finqa
      MINIO_ROOT_PASSWORD: finqa12345
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - finqa_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: creates the filing-pdfs bucket, then exits. Re-running is a no-op.
  minio-init:
    image: minio/mc:latest
    container_name: finqa-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 finqa finqa12345 &&
      mc mb -p local/filing-pdfs &&
      echo 'bucket ready'
      "

  api:
    build:
      context: ../..
      dockerfile: deployment/docker/api.Dockerfile
    container_name: finqa-api-v2
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FINQA_PG_URL: postgresql://finqa:finqa@postgres:5432/finqa
      FINQA_V2_API_CORS_ORIGINS: "*"
      FINQA_V2_LOG_JSON: "1"
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "8010:8010"
    volumes:
      # read-only: the API never writes to the dataset, only the retrieval index
      # files and (unused here, since FINQA_PG_URL is set) the SQLite fallback live
      # under this path.
      - ../../database/data:/app/database/data:ro

  dashboard:
    build:
      context: ../..
      dockerfile: deployment/docker/dashboard.Dockerfile
      # no VITE_API_BASE_URL override -- the Dockerfile's own default ("") is what we
      # want here: same-origin calls that nginx.conf reverse-proxies to the api
      # container internally, not the browser hitting the published host port.
    container_name: finqa-dashboard-v2
    depends_on:
      - api
    ports:
      - "5174:80"

  # Not started by `up` -- run on demand: `docker compose run --rm worker <cmd>`.
  worker:
    build:
      context: ../..
      dockerfile: deployment/docker/worker.Dockerfile
    profiles: ["tools"]
    environment:
      FINQA_PG_URL: postgresql://finqa:finqa@postgres:5432/finqa
    volumes:
      - ../../database/data:/app/database/data
      - ../../data_extraction/data:/app/data_extraction/data

  prometheus:
    image: prom/prometheus:latest
    container_name: finqa-prometheus
    depends_on:
      - api
    volumes:
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - finqa_prometheus_data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: finqa-grafana
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: finqa12345
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - finqa_grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"

volumes:
  finqa_pg_data:
  finqa_minio_data:
  finqa_prometheus_data:
  finqa_grafana_data:
