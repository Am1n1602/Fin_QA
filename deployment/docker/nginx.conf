server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Reverse-proxy API calls over the Docker-internal network (container name "api",
    # resolved by Docker's embedded DNS) instead of the browser calling the host's
    # published 8010 port directly. Found necessary in practice, not just tidy: under
    # Docker Desktop for Windows, a burst of concurrent browser requests through the
    # host port-forwarding layer intermittently stalled/reset (reproduced with plain
    # curl too, unrelated to this app -- a single request or a sequence run from
    # *inside* the api container was always fast); container-to-container traffic on
    # the compose network doesn't cross that layer at all. dashboard.Dockerfile builds
    # with VITE_API_BASE_URL="" so the frontend calls these same-origin paths.
    location /api/ {
        proxy_pass http://api:8010/api/;
        proxy_set_header Host $host;
    }

    location /health {
        proxy_pass http://api:8010/health;
        proxy_set_header Host $host;
    }

    # dashboard_v2 is client-side routed (react-router) -- any unmatched path falls
    # back to index.html so a direct load of e.g. /companies/TCS works, not just
    # in-app navigation to it.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
