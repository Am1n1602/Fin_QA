server {
    listen 80;
    server_name _;
    index index.html;

    # No /api/ proxy_pass here (unlike nginx.conf) -- this variant is for hosts with no
    # sibling "api" container to resolve (Cloud Run via Firebase Hosting path rewrites).
    # The frontend calls an absolute VITE_API_BASE_URL baked in at build time instead.

    # Firebase's "run" rewrite target forwards the ORIGINAL request path unchanged --
    # it does not strip the matched /finqa-v2/** prefix (confirmed empirically: a
    # request for /finqa-v2/assets/foo.js arrives here as literally that path). `alias`
    # (not `root`) strips the /finqa-v2/ location prefix back off before hitting the
    # filesystem, where the vite build's own output sits unprefixed (base: "/finqa-v2/"
    # only rewrites the URLs *inside* index.html, not the dist/ folder layout).
    location /finqa-v2/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /finqa-v2/index.html;
    }

    location = /finqa-v2 {
        return 301 /finqa-v2/;
    }
}
